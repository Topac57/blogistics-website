kind = "web"
previewPath = "/"
title = "Tolga-Baris Coskun Umzüge & Transporte"
version = "1.0.0"
id = "artifacts/umzuege-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23457

[services.development]
run = "pnpm --filter @workspace/umzuege-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/umzuege-website", "run", "build" ]
publicDir = "artifacts/umzuege-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23457"
BASE_PATH = "/"
